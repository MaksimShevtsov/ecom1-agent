[project]
name = "ecom1-agent"
version = "0.1.0"
description = "BitGN ECOM1 agent on Pydantic AI + pydantic-ai-harness, powered by z.ai GLM"
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # BitGN SDK (generated by Buf). Pins match bitgn/sample-agents/ecom-py.
    "bitgn-api-connectrpc-python==0.10.1.1.20260609131003+ed9edb653ac2",
    "bitgn-api-protocolbuffers-python==35.0.0.1.20260609131003+ed9edb653ac2",
    # The generated SDK targets connectrpc 0.10.x (0.13 changed MethodInfo).
    "connectrpc>=0.10.1,<0.11",
    # harness 0.N ships together with pydantic-ai 2.N: keep the pair in lockstep.
    "pydantic-ai-slim[zai,web,logfire]==2.64.0",
    "pydantic-ai-harness[codemode,repair-tool-arguments,prompt-injection-defender]==0.64.0",
    "pydantic-evals==2.64.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Semantic (ONNX) prompt-injection classifier for the `defender_ml` flag.
defender-ml = ["pydantic-ai-harness[prompt-injection-defender-ml]==0.64.0"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[[tool.uv.index]]
name = "buf"
url = "https://buf.build/gen/python"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.logfire]
ignore_no_config = true
